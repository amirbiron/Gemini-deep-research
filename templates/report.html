<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
        .prose-rtl h1 { font-size: 2rem; font-weight: 700; margin: 1.5rem 0 1rem; color: #111; }
        .prose-rtl h2 { font-size: 1.5rem; font-weight: 600; margin: 1.25rem 0 0.75rem; color: #1f2937; }
        .prose-rtl h3 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem; color: #374151; }
        .prose-rtl p { margin: 0.75rem 0; line-height: 1.8; color: #374151; }
        .prose-rtl ul, .prose-rtl ol { margin: 0.75rem 0; padding-right: 1.5rem; }
        .prose-rtl li { margin: 0.25rem 0; line-height: 1.7; color: #374151; }
        .prose-rtl strong { color: #111; font-weight: 600; }
        .prose-rtl em { color: #4b5563; }
        .prose-rtl code {
            background: #f3f4f6; padding: 0.125rem 0.375rem;
            border-radius: 0.25rem; font-size: 0.875em;
            font-family: ui-monospace, monospace;
        }
        .prose-rtl pre {
            background: #1f2937; color: #f9fafb; padding: 1rem;
            border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0;
            direction: ltr; text-align: left;
        }
        .prose-rtl pre code { background: transparent; padding: 0; color: inherit; }
        .prose-rtl table {
            border-collapse: collapse; width: 100%; margin: 1rem 0;
            font-size: 0.95em;
        }
        .prose-rtl th, .prose-rtl td {
            border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem;
            text-align: right;
        }
        .prose-rtl th { background: #f9fafb; font-weight: 600; }
        .prose-rtl blockquote {
            border-right: 4px solid #3b82f6; padding-right: 1rem;
            margin: 1rem 0; color: #4b5563; font-style: italic;
        }
        .prose-rtl a { color: #2563eb; text-decoration: underline; }
        .prose-rtl a:hover { color: #1d4ed8; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- כפתור העתקה צף -->
<button
    id="copy-btn"
    onclick="copyReport()"
    class="fixed top-4 left-4 z-50 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg shadow-lg transition-all duration-200 flex items-center gap-2"
>
    <svg id="copy-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
    </svg>
    <span id="copy-label">העתק טקסט</span>
</button>

<div class="max-w-4xl mx-auto px-4 py-8">

    <!-- כותרת ומידע -->
    <header class="mb-8 pb-6 border-b border-gray-200">
        <a href="/archive" class="text-sm text-blue-600 hover:text-blue-800 mb-3 inline-block">
            ← חזרה לארכיון
        </a>
        <h1 class="text-3xl font-bold text-gray-900 mb-3">{{ title }}</h1>
        <div class="text-sm text-gray-600 space-y-1">
            <div><span class="font-medium">השאלה:</span> {{ query }}</div>
            {% if created_at %}
            <div><span class="font-medium">נוצר:</span> {{ created_at.strftime("%d/%m/%Y %H:%M") }}</div>
            {% endif %}
        </div>
    </header>

    <!-- גוף הדו"ח -->
    <article class="prose-rtl bg-white rounded-lg shadow-sm p-6 md:p-10" id="report-content">
        {{ report_html | safe }}
    </article>

    <footer class="mt-8 text-center text-xs text-gray-400">
        Deep Research Bot
    </footer>
</div>

<!-- שדה נסתר עם הטקסט הגולמי, להעתקה -->
<textarea id="raw-text" class="hidden">{{ report_raw }}</textarea>

<script>
async function copyReport() {
    const rawText = document.getElementById('raw-text').value;
    const label = document.getElementById('copy-label');
    const icon = document.getElementById('copy-icon');
    const btn = document.getElementById('copy-btn');

    try {
        await navigator.clipboard.writeText(rawText);
        label.textContent = 'הועתק! ✓';
        btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
        btn.classList.add('bg-green-600');

        setTimeout(() => {
            label.textContent = 'העתק טקסט';
            btn.classList.remove('bg-green-600');
            btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
        }, 2000);
    } catch (err) {
        label.textContent = 'שגיאה בהעתקה';
        console.error(err);
    }
}
</script>

</body>
</html>
